[package]
name = "vmbuild"
version = "0.1.0"
edition = "2024"
description = "Fast, content-addressed VM rootfs builder for Firecracker/KVM"
license = "MIT OR Apache-2.0"
readme = "README.md"
# edition 2024
rust-version = "1.85"
keywords = ["ext4", "firecracker", "microvm", "rootfs", "buildkit"]
categories = ["development-tools::build-utils", "filesystem", "virtualization"]
# TODO(you): set before publishing -- I don't know the URL, and a wrong one is
# worse than none. `documentation` defaults to docs.rs and needs no entry.
# repository = "https://github.com/<org>/vmbuild"

[dependencies]
tar = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
# heyvm's POST /images/build ships the context as gzipped tar.
flate2 = "1"
tempfile = "3"
# For errno constants (EXDEV); avoids hardcoding a magic number that
# happens to agree across Linux and macOS.
libc = "0.2"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tar = "0.4"

[profile.release]
debug = 1
